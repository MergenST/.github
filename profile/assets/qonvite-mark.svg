<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Qonvite mark: a QR finder pattern — the concentric "eye" that anchors
       every QR code — with a detached module at the lower right where a Q's
       tail would sit. Drawn as solid geometry rather than <text> so it
       rasterizes identically on every platform; the detached module is what
       survives downscaling to 16px, where a stroked tail disappears and the
       mark collapses into a generic rounded square. -->
  <rect width="32" height="32" rx="7" fill="#5457cd"/>
  <rect x="6" y="6" width="15.4" height="15.4" rx="2"
        fill="none" stroke="#fff" stroke-width="3.3"/>
  <rect x="11.4" y="11.4" width="5.2" height="5.2" rx="0.9" fill="#fff"/>
  <rect x="23.3" y="23.3" width="5" height="5" rx="1.1" fill="#fff"/>
</svg>
