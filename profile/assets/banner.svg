    <rect x="1076" y="162" width="36" height="36" rx="9" fill="#2e58d7"/>
    <rect x="1088" y="174" width="12" height="12" rx="3" fill="#eee7d4"/>

    <!-- Copy -->
    <text x="72" y="106" fill="#6f8cf0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3">CUSTOM SOFTWARE · AUTOMATION · APPLIED AI</text>
    <text x="68" y="214" fill="#eee7d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-4">mergen<tspan fill="#2e58d7">.</tspan></text>
    <text x="72" y="264" fill="#eee7d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">Technology made here. Businesses that go further.</text>
    <text x="72" y="304" fill="#aaa391" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1">São Luís — MA · Brazil</text>
