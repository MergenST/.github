<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Mergen</title>
  <desc id="desc">Custom software, automation and applied AI. Technology made here. Businesses that go further. São Luís, Brazil.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#eee7d4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="1060" cy="180" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e58d7" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2e58d7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="760" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aaa391" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6f8cf0" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#090812"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- Scattered routines flowing into an ordered system -->
    <g fill="none" stroke="url(#fade)" stroke-width="1.5">
      <path d="M800 84 C900 84 930 100 1000 100"/>
      <path d="M846 136 C920 136 930 100 1000 100"/>
      <path d="M824 196 C910 196 930 180 1000 180"/>
      <path d="M884 168 C940 168 950 180 1000 180"/>
      <path d="M868 236 C930 236 940 260 1000 260"/>
      <path d="M806 284 C900 284 930 260 1000 260"/>
      <path d="M892 300 C950 300 960 260 1000 260"/>
    </g>
    <g fill="#eee7d4">
      <circle cx="800" cy="84" r="4" fill-opacity="0.35"/>
      <circle cx="846" cy="136" r="5" fill-opacity="0.5"/>
      <circle cx="824" cy="196" r="3.5" fill-opacity="0.3"/>
      <circle cx="884" cy="168" r="4.5" fill-opacity="0.55"/>
      <circle cx="868" cy="236" r="5" fill-opacity="0.45"/>
      <circle cx="806" cy="284" r="3.5" fill-opacity="0.3"/>
      <circle cx="892" cy="300" r="4" fill-opacity="0.5"/>
      <circle cx="770" cy="150" r="2.5" fill-opacity="0.2"/>
      <circle cx="782" cy="250" r="2.5" fill-opacity="0.2"/>
      <circle cx="914" cy="64" r="2.5" fill-opacity="0.25"/>
    </g>

    <g stroke="#2e58d7" stroke-opacity="0.7" stroke-width="2">
      <path d="M1014 100H1174M1014 180H1174M1014 260H1174M1014 100V260M1094 100V260M1174 100V260"/>
    </g>
    <g stroke="#6f8cf0" stroke-width="2" fill="#10142e">
      <rect x="1000" y="86" width="28" height="28" rx="7"/>
      <rect x="1080" y="86" width="28" height="28" rx="7"/>
      <rect x="1160" y="86" width="28" height="28" rx="7"/>
      <rect x="1000" y="166" width="28" height="28" rx="7"/>
      <rect x="1160" y="166" width="28" height="28" rx="7"/>
      <rect x="1000" y="246" width="28" height="28" rx="7"/>
      <rect x="1080" y="246" width="28" height="28" rx="7"/>
      <rect x="1160" y="246" width="28" height="28" rx="7"/>
